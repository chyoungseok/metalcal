<!doctype html>
<html lang="ko" data-theme="titanium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metal Calendar</title>
<meta name="description" content="기기 안에만 저장되는 개인용 메탈 캘린더 (PWA)">
<meta name="theme-color" content="#1d2126">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메탈캘린더">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="top">
      <button class="btn icon flat" id="bMenu" aria-label="메뉴"></button>
      <button class="title" id="title"></button>
      <div class="navg">
        <button class="btn icon" id="bPrev" aria-label="이전"></button>
        <button class="btn" id="bToday">오늘</button>
        <button class="btn icon" id="bNext" aria-label="다음"></button>
      </div>
      <div class="qa" id="qaWrap">
        <span id="qaIcon"></span>
        <input id="qa" class="in" autocomplete="off" placeholder="빠른 추가 — 내일 오후 3시 회의 #업무 !1">
        <div id="qaHint"></div>
      </div>
      <div class="seg seg-views" id="segViews"></div>
      <button class="btn icon" id="bSearch" aria-label="검색"></button>
      <button class="btn icon" id="bSet" aria-label="설정"></button>
    </header>
    <div id="subbar"></div>
    <section id="view"></section>
    <nav id="bottom"></nav>
  </main>
  <button id="fab" class="fab" aria-label="새 일정">+</button>
</div>
<div id="toast"></div>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/nlp.js"></script>
<script src="js/views.js"></script>
<script src="js/drag.js"></script>
<script src="js/editor.js"></script>
<script src="js/panels.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/goals.js"></script>
<script src="js/ledger.js"></script>
<script src="js/notes.js"></script>
<script src="js/sync.js"></script>
<script src="js/portable.js"></script>
<script src="js/app.js"></script>
</body>
</html>
